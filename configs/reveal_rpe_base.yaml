# Rung R-A reveal-token signed-RPE BASE capture (rq8_rpe_valence_spec §4.4; R-A plan).
#
# Copied from the parent program's configs/rq8_pe_reveal_rpe_base.yaml @ 10c4662; every numeric
# and symbol value is unchanged. Adapted only where the loader differs: the unused stimuli.cvt
# block is dropped (the parent's StudyConfig required it; this one does not), and adapter_dir is
# gone because this scaffold is base-side by construction.
#
# BASE weights only, NO adapter, on the design §2 primary (registry key `qwen_30b_primary`; the
# runbook resolves its repo id and revision on the instance). Read-only residual-stream capture at the
# byte-pinned outcome-reveal token — no steering, no training, no GPU write. Tests whether a
# SIGNED reward-prediction-error direction is present and separable from realised reward, EV, and
# unsigned surprise |RPE|. The licence is capped to PRESENT-AND-SEPARABLE: R-A has no causal arm
# and licenses no functional / welfare / experience claim.
#
# This run reproduces the R-A' RECIPE. It does not inherit the R-A' CERTIFICATION: at ~30B every
# gate value is re-earned, including the selected block (20/36 was a 4B number).
#
# Offline contract: run with HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 (see `just extract-rpe`);
# the registry pins the model revision with local_files_only true. Outputs live under the
# gitignored runs/ root.
run:
  id: reveal_rpe_base
  output_root: runs
  seed: 7

provenance:
  project_or_claim_family: rq8-pe-reveal-rpe
  prompt_or_workflow_version: reveal-rpe-base/v1
  known_gaps:
    - "RUNG R-A is REPRESENTATIONAL only: a present-and-separable signed-RPE direction is a
      measurement-validity claim about a representation. It is NOT functional use, welfare,
      sentience, or experience, and there is no causal arm here (that is a separate rung)."
    - "reward = ev + signed_rpe exactly, so signed RPE is entangled with realised reward; the
      identifiable claims are signed-beyond-unsigned (the matched-sign conjunction) and gradient
      orientation. Incremental-variance-over-value is structurally ill-posed and is NOT gated."
    - "SYMBOL NEUTRALITY IS NOT RE-CALIBRATED AT 30B (design §2). The frozen SIL/WAN/GIS/PIL
      calibration in data/symbol_calibration/qwen3_4b_instruct_2507 is a BEHAVIOURAL property of
      the 4B checkpoint and this scaffold does not port the calibration assay, so at the resolved
      model it is a recorded known gap. The run-time preflight still gates single-token-ness, and
      balanced rendering (both orders x both strata x four templates at equal weight) puts symbol
      identity in the design intercept rather than the signed-RPE slope -- that MITIGATES the gap,
      it does not remove it."
    - "RESOLVED MODEL DEVIATES FROM THE DESIGN §2 DESCRIPTOR (runbook §2 step 2; resolved
      2026-08-14). Design §2 names a ~27-32B DENSE INSTRUCT release; the resolved
      Qwen/Qwen3.6-27B @ 6a9e13bd is dense-not-MoE and in band (27.78B), but it is (a) a
      MULTIMODAL checkpoint (`Qwen3_5ForConditionalGeneration`, `image-text-to-text`) of which we
      load only the text tower via AutoModelForCausalLM -> Qwen3_5ForCausalLM, and (b) a HYBRID
      ATTENTION stack: 48 linear_attention + 16 full_attention layers over 64 blocks, not the
      uniform full-attention transformer the R-A' recipe was certified on at 4B. There is no
      text-only dense alternative in the Qwen 3.5/3.6 generation, and the only other in-band-ish
      release (Qwen3.6-35B-A3B) is MoE — so this is the nearest available release, not a free
      choice. CONSEQUENCE FOR READING THE RESULT: block indices are not comparable to the 4B
      run (65 hidden-state tensors vs 37), and 'the residual stream' at a linear_attention block
      is not the same object as at a full_attention block. Whether the selected block lands on a
      full- or linear-attention layer is a REPORTABLE property of this run, not a nuisance."
  decision_affected:
    - docs/design/experiment.md

model:
  registry_path: configs/model_registry.yaml
  key: qwen_30b_primary

reveal_rpe:
  seed: 7
  # PILOT POWER-UP (2026-07-04, operator-ratified): the first R-A base capture came in at
  # verdict=indeterminate with every identification gate passing decisively and the SOLE miss
  # being split-half stability (0.776 < 0.80). Root cause was two-fold: (a) the stability split
  # was row-level (leakage-inflated), now fixed to a draw-grouped, K-averaged cosine; (b) per-half
  # N was small (~144 rows). This raises N so the HONEST metric has a fair shot at 0.80.
  # single_shot_per_cell 8->16 grows distinct draws 94->~124 (saturates ~124 as EV terciles
  # exhaust) — also strengthens the matched contests; renderings_per_reveal 2->8 multiplies rows
  # within the 32-surface ceiling (2 shared + 2 held-out symbols x 2 orders x 4 templates = 32 —
  # NO new symbols, no re-calibration). ~1984 reveals, est ~1488, ~744 rows / ~62 draws per half.
  # PRE-COMMITMENT: one N level, one capture, report pass OR fail honestly — do not iterate N to
  # pass (that would p-hack the near-miss). Both-outcome balanced enumeration is unconditional, so
  # signed_rpe⊥ev / ⊥|RPE| stay exact and the design stays rank-5.
  single_shot_per_cell: 16
  renderings_per_reveal: 8
  reward_matched_augment: true
  # FROZEN 2026-06-28 neutrality-calibrated nonce pairs (data/symbol_calibration/
  # qwen3_4b_instruct_2507), single-token leading-space on the 4B tokenizer; the run-time preflight
  # re-gates single-token-ness on the resolved model. The NEUTRALITY calibration itself is a 4B
  # behavioural property and does NOT transfer — a recorded known gap (design §2), mitigated by
  # balanced rendering, not removed.
  shared_symbols: [SIL, WAN]
  held_out_symbols: [GIS, PIL]
  partitions: [estimation, selection]
  n_permutations: 1000
  n_random_directions: 200
  alpha: 0.05
